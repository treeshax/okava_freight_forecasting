version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - DATABASE_URL=sqlite:////data/charter_iq.db
      - RL_SERVICE_URL=http://rl-verifier:8001
    volumes:
      - db-data:/data
    restart: always

  rl-verifier:
    build:
      context: .
      dockerfile: docker/rl-verifier/Dockerfile
    ports:
      - "8001:8001"
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - DATABASE_URL=sqlite:////data/charter_iq.db
    volumes:
      - db-data:/data
    depends_on:
      - api
    restart: always

volumes:
  db-data:
